name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Hard Reset and Build
        run: |
          # حذف تمام فایل‌های پروژه قبلی به جز پوشه .github
          find . -maxdepth 1 -not -name '.github' -not -name '.' -exec rm -rf {} +
          
          # ساخت پروژه پایه فلاتر
          flutter create . --project-name tiba2_launcher
          
          # جایگزینی مستقیم pubspec
          cat << 'EOF' > pubspec.yaml
          name: tiba2_launcher
          description: A new Flutter project.
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            geolocator: ^10.1.0
            permission_handler: ^11.3.0
            android_intent_plus: ^4.0.3
          flutter:
            uses-material-design: true
          EOF
          
          # نصب پکیج‌ها
          flutter pub get
          
          # اصلاحات کاتلین
          find android -type f -name "build.gradle" -exec sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.22'/g" {} +
          
          # کد برنامه (main.dart)
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          void main() => runApp(const MaterialApp(home: Scaffold(body: Center(child: Text("Launcher Ready")))));
          EOF
          
          # بیلد آزمایشی (فقط برای تست پایداری گریدل)
          flutter build apk --release
          
      - uses: actions/upload-artifact@v4
        with:
          name: Tiba2_Test_APK
          path: build/app/outputs/flutter-apk/app-release.apk
