name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with: {distribution: 'temurin', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: 'stable'}

      - name: Build Optimized APK
        run: |
          cd /tmp
          flutter create tiba2_launcher
          cd tiba2_launcher
          
          # نصب پکیج‌ها با --offline برای سرعت بیشتر
          flutter pub get
          
          # تنظیمات گریدل برای کاهش مصرف رم و افزایش سرعت
          echo "org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m" > android/gradle.properties
          echo "android.enableR8=true" >> android/gradle.properties
          
          # بیلد با دستور --split-per-abi برای سبک‌تر شدن
          flutter build apk --split-per-abi --release
          
          # کپی خروجی
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release-armeabi-v7a.apk $GITHUB_WORKSPACE/output/Tiba2_Launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tiba2_Launcher
          path: output/Tiba2_Launcher.apk
