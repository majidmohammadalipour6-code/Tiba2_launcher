name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Project
        run: |
          mkdir -p temp_app
          cd temp_app
          flutter create --project-name tiba2_launcher .
          flutter pub add geolocator permission_handler android_intent_plus
          cp -r android ../
          cp pubspec.yaml ../
          cd ..
          rm -rf temp_app
          find android -type f \( -name "build.gradle" -o -name "settings.gradle" \) -exec sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.22'/g" {} +
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:geolocator/geolocator.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:android_intent_plus/android_intent.dart';

          void main() => runApp(const TibaLauncher());

          class TibaLauncher extends StatelessWidget {
            const TibaLauncher({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(debugShowCheckedModeBanner: false, theme: ThemeData.dark(), home: const Dashboard());
            }
          }

          class Dashboard extends StatefulWidget { const Dashboard({super.key}); @override State<Dashboard> createState() => _DashboardState(); }

          class _DashboardState extends State<Dashboard> {
            double _speed = 0.0;
            bool _nightMode = true;

            @override
            void initState() {
              super.initState();
              _startGps();
            }

            void _startGps() async {
              if (await Permission.location.request().isGranted) {
                Geolocator.getPositionStream().listen((pos) {
                  setState(() { _speed = pos.speed * 3.6; });
                });
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: _nightMode ? Colors.black : const Color(0xFF1E1E1E),
                body: Column(
                  children: [
                    Expanded(child: Center(
                      child: Stack(alignment: Alignment.center, children: [
                        CustomPaint(size: const Size(200, 200), painter: SpeedometerPainter(_speed)),
                        Text("${_speed.toInt()}", style: const TextStyle(fontSize: 50, fontWeight: FontWeight.bold, color: Colors.cyan)),
                      ]),
                    )),
                    GridView.count(
                      shrinkWrap: true, crossAxisCount: 2, padding: const EdgeInsets.all(20),
                      children: [
                        _card(Icons.music_note, "تنظیمات صدا", () => const AndroidIntent(action: 'android.settings.SOUND_SETTINGS').launch()),
                        _card(_nightMode ? Icons.wb_sunny : Icons.nights_stay, "حالت شب", () => setState(() => _nightMode = !_nightMode)),
                      ],
                    )
                  ],
                ),
              );
            }
            Widget _card(IconData icon, String title, VoidCallback onTap) => InkWell(onTap: onTap, child: Card(color: Colors.white10, child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(icon, size: 40), Text(title)])));
          }

          class SpeedometerPainter extends CustomPainter {
            final double speed;
            SpeedometerPainter(this.speed);
            @override
            void paint(Canvas canvas, Size size) {
              Paint paint = Paint()..color = Colors.white24..strokeWidth = 10..style = PaintingStyle.stroke;
              canvas.drawArc(Rect.fromLTWH(0, 0, size.width, size.height), 3.14, 3.14, false, paint);
              Paint needle = Paint()..color = Colors.cyan..strokeWidth = 5;
              double angle = (speed / 200) * 3.14;
              canvas.drawLine(Offset(size.width/2, size.height/2), Offset(size.width/2 + 80*cos(angle + 3.14), size.height/2 + 80*sin(angle + 3.14)), needle);
            }
            @override bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2_Pro_Launcher
          path: build/app/outputs/flutter-apk/app-release.apk
