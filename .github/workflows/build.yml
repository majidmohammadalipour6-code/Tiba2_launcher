name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup and Build
        run: |
          # پاکسازی محیط برای شروع تازه
          find . -maxdepth 1 -not -name '.github' -not -name '.' -exec rm -rf {} +

          # ساخت پروژه تمیز
          flutter create . --project-name tiba2_launcher --platforms=android

          # افزودن پکیج‌ها با نسخه‌های تست‌شده و پایدار
          flutter pub add geolocator:^10.1.0 permission_handler:^11.3.0 android_intent_plus:^4.0.3

          # تنظیم دقیق نسخه‌های اندروید و کاتلین
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle || true

          # هماهنگ‌سازی نسخه کاتلین
          find android -type f -name "build.gradle" -exec sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.22'/g" {} +
          find android -type f -name "settings.gradle" -exec sed -i "s/id \"org.jetbrains.kotlin.android\" version .*/id \"org.jetbrains.kotlin.android\" version \"1.9.22\" apply false/g" {} +

          # مجوزهای GPS
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml

          # ایجاد کد اصلی لانچر
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:geolocator/geolocator.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:android_intent_plus/android_intent.dart';

          void main() {
            runApp(const TibaLauncher());
          }

          class TibaLauncher extends StatelessWidget {
            const TibaLauncher({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(),
                home: const Dashboard(),
              );
            }
          }

          class Dashboard extends StatefulWidget {
            const Dashboard({super.key});

            @override
            State<Dashboard> createState() => _DashboardState();
          }

          class _DashboardState extends State<Dashboard> {
            double _speed = 0.0;
            bool _nightMode = true;
            StreamSubscription<Position>? _positionStream;

            @override
            void initState() {
              super.initState();
              _initGps();
            }

            void _initGps() async {
              var status = await Permission.location.request();
              if (status.isGranted) {
                _positionStream = Geolocator.getPositionStream(
                  locationSettings: const LocationSettings(
                    accuracy: LocationAccuracy.high,
                    distanceFilter: 1,
                  ),
                ).listen((Position position) {
                  setState(() {
                    _speed = (position.speed * 3.6).clamp(0.0, 240.0);
                  });
                });
              }
            }

            @override
            void dispose() {
              _positionStream?.cancel();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              Color bgColor = _nightMode ? const Color(0xFF080C14) : const Color(0xFF1B2232);
              Color accentColor = _nightMode ? Colors.cyanAccent : Colors.orangeAccent;

              return Scaffold(
                backgroundColor: bgColor,
                body: SafeArea(
                  child: Column(
                    children: [
                      const SizedBox(height: 10),
                      Expanded(
                        child: Center(
                          child: Stack(
                            alignment: Alignment.center,
                            children: [
                              CustomPaint(
                                size: const Size(220, 220),
                                painter: ModernSpeedometerPainter(_speed, accentColor),
                              ),
                              Column(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  Text(
                                    "${_speed.toInt()}",
                                    style: TextStyle(
                                      fontSize: 64,
                                      fontWeight: FontWeight.w900,
                                      color: accentColor,
                                      shadows: [
                                        Shadow(color: accentColor.withOpacity(0.4), blurRadius: 18),
                                      ],
                                    ),
                                  ),
                                  const Text(
                                    "KM/H",
                                    style: TextStyle(fontSize: 13, color: Colors.white54, letterSpacing: 4),
                                  ),
                                ],
                              ),
                            ],
                          ),
                        ),
                      ),
                      Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 15),
                        child: Row(
                          children: [
                            Expanded(
                              child: _btnCard(
                                icon: Icons.equalizer_rounded,
                                title: "تنظیمات باند و صدا",
                                subtitle: "فیدر، بالانس و ساب",
                                onTap: () {
                                  const AndroidIntent(action: 'android.settings.SOUND_SETTINGS').launch();
                                },
                              ),
                            ),
                            const SizedBox(width: 15),
                            Expanded(
                              child: _btnCard(
                                icon: _nightMode ? Icons.nightlight_round : Icons.wb_sunny_rounded,
                                title: _nightMode ? "حالت شب (تیره)" : "حالت روز (روشن)",
                                subtitle: "کنترل نور مانیتور",
                                onTap: () {
                                  setState(() {
                                    _nightMode = !_nightMode;
                                  });
                                },
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _btnCard({
              required IconData icon,
              required String title,
              required String subtitle,
              required VoidCallback onTap,
            }) {
              return InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(16),
                child: Container(
                  padding: const EdgeInsets.symmetric(vertical: 14, horizontal: 10),
                  decoration: BoxDecoration(
                    color: Colors.white.withOpacity(0.06),
                    borderRadius: BorderRadius.circular(16),
                    border: Border.all(color: Colors.white12),
                  ),
                  child: Column(
                    children: [
                      Icon(icon, size: 30, color: Colors.white70),
                      const SizedBox(height: 6),
                      Text(title, style: const TextStyle(fontSize: 13, fontWeight: FontWeight.bold, color: Colors.white)),
                      const SizedBox(height: 2),
                      Text(subtitle, style: const TextStyle(fontSize: 10, color: Colors.white38)),
                    ],
                  ),
                ),
              );
            }
          }

          class ModernSpeedometerPainter extends CustomPainter {
            final double speed;
            final Color accentColor;
            ModernSpeedometerPainter(this.speed, this.accentColor);

            @override
            void paint(Canvas canvas, Size size) {
              final center = Offset(size.width / 2, size.height / 2);
              final radius = size.width / 2;

              final bgPaint = Paint()
                ..color = Colors.white12
                ..style = PaintingStyle.stroke
                ..strokeCap = StrokeCap.round
                ..strokeWidth = 12;
              canvas.drawArc(Rect.fromCircle(center: center, radius: radius), pi * 0.75, pi * 1.5, false, bgPaint);

              final activePaint = Paint()
                ..color = accentColor
                ..style = PaintingStyle.stroke
                ..strokeCap = StrokeCap.round
                ..strokeWidth = 12;
              double sweep = (speed / 200.0) * (pi * 1.5);
              canvas.drawArc(Rect.fromCircle(center: center, radius: radius), pi * 0.75, sweep.clamp(0.0, pi * 1.5), false, activePaint);

              double needleAngle = (pi * 0.75) + sweep;
              final needlePaint = Paint()
                ..color = Colors.white
                ..strokeWidth = 3
                ..strokeCap = StrokeCap.round;
              Offset needleEnd = Offset(center.dx + (radius - 18) * cos(needleAngle), center.dy + (radius - 18) * sin(needleAngle));
              canvas.drawLine(center, needleEnd, needlePaint);
            }

            @override
            bool shouldRepaint(covariant ModernSpeedometerPainter oldDelegate) => true;
          }
          EOF

          # ساخت APK نهایی
          flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2_Monitor_Launcher
          path: build/app/outputs/flutter-apk/app-release.apk
