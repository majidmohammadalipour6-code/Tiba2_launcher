name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Launcher APK
        run: |
          cd /tmp
          rm -rf tiba_launcher
          flutter create --org com.tiba --project-name tiba_launcher tiba_launcher
          cd tiba_launcher

          # تنظیم مشخصات پکیج‌ها
          cat << 'EOF' > pubspec.yaml
          name: tiba_launcher
          description: Tiba 2 Car Launcher
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            geolocator: ^10.1.0
            permission_handler: ^11.3.0
            android_intent_plus: ^4.0.3
          flutter:
            uses-material-design: true
          EOF

          flutter pub get

          # تنظیمات سازگاری نسخه اندروید
          cat << 'GRADLE' >> android/app/build.gradle

          android {
              compileSdkVersion 34
              defaultConfig {
                  minSdkVersion 21
                  targetSdkVersion 34
              }
          }
          GRADLE

          # دسترسی‌های لوکیشن در مانیتور خودرو
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml

          # کد لانچر اختصاصی تیبا ۲
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:geolocator/geolocator.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:android_intent_plus/android_intent.dart';

          void main() => runApp(const TibaLauncherApp());

          class TibaLauncherApp extends StatelessWidget {
            const TibaLauncherApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(),
                home: const LauncherHome(),
              );
            }
          }

          class LauncherHome extends StatefulWidget {
            const LauncherHome({super.key});
            @override
            State<LauncherHome> createState() => _LauncherHomeState();
          }

          class _LauncherHomeState extends State<LauncherHome> {
            double _speed = 0.0;
            bool _nightMode = true;
            StreamSubscription<Position>? _sub;

            @override
            void initState() {
              super.initState();
              _setupGps();
            }

            void _setupGps() async {
              var s = await Permission.location.request();
              if (s.isGranted) {
                _sub = Geolocator.getPositionStream(
                  locationSettings: const LocationSettings(accuracy: LocationAccuracy.high, distanceFilter: 1),
                ).listen((pos) {
                  setState(() {
                    _speed = (pos.speed * 3.6).clamp(0.0, 240.0);
                  });
                });
              }
            }

            @override
            void dispose() {
              _sub?.cancel();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              Color bg = _nightMode ? const Color(0xFF090D14) : const Color(0xFF1E2638);
              Color neon = _nightMode ? Colors.cyanAccent : Colors.amberAccent;

              return Scaffold(
                backgroundColor: bg,
                body: SafeArea(
                  child: Column(
                    children: [
                      const SizedBox(height: 12),
                      Expanded(
                        child: Center(
                          child: Stack(
                            alignment: Alignment.center,
                            children: [
                              CustomPaint(
                                size: const Size(220, 220),
                                painter: SpeedGaugePainter(_speed, neon),
                              ),
                              Column(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  Text(
                                    "${_speed.toInt()}",
                                    style: TextStyle(
                                      fontSize: 64,
                                      fontWeight: FontWeight.w900,
                                      color: neon,
                                      shadows: [Shadow(color: neon.withOpacity(0.5), blurRadius: 16)],
                                    ),
                                  ),
                                  const Text("KM/H", style: TextStyle(color: Colors.white54, fontSize: 13, letterSpacing: 3)),
                                ],
                              ),
                            ],
                          ),
                        ),
                      ),
                      Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 14),
                        child: Row(
                          children: [
                            Expanded(
                              child: _cardBtn(
                                icon: Icons.equalizer_rounded,
                                title: "تنظیمات صدا",
                                desc: "اکولایزر و باندها",
                                onTap: () => const AndroidIntent(action: 'android.settings.SOUND_SETTINGS').launch(),
                              ),
                            ),
                            const SizedBox(width: 12),
                            Expanded(
                              child: _cardBtn(
                                icon: _nightMode ? Icons.nightlight_round : Icons.wb_sunny_rounded,
                                title: _nightMode ? "حالت شب" : "حالت روز",
                                desc: "تنظیم نور صفحه",
                                onTap: () => setState(() => _nightMode = !_nightMode),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _cardBtn({required IconData icon, required String title, required String desc, required VoidCallback onTap}) {
              return InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(14),
                child: Container(
                  padding: const EdgeInsets.symmetric(vertical: 12, horizontal: 8),
                  decoration: BoxDecoration(
                    color: Colors.white.withOpacity(0.06),
                    borderRadius: BorderRadius.circular(14),
                    border: Border.all(color: Colors.white12),
                  ),
                  child: Column(
                    children: [
                      Icon(icon, size: 28, color: Colors.white70),
                      const SizedBox(height: 6),
                      Text(title, style: const TextStyle(fontSize: 12, fontWeight: FontWeight.bold, color: Colors.white)),
                      const SizedBox(height: 2),
                      Text(desc, style: const TextStyle(fontSize: 10, color: Colors.white38)),
                    ],
                  ),
                ),
              );
            }
          }

          class SpeedGaugePainter extends CustomPainter {
            final double speed;
            final Color color;
            SpeedGaugePainter(this.speed, this.color);

            @override
            void paint(Canvas canvas, Size size) {
              final center = Offset(size.width / 2, size.height / 2);
              final r = size.width / 2;

              final track = Paint()
                ..color = Colors.white12
                ..style = PaintingStyle.stroke
                ..strokeCap = StrokeCap.round
                ..strokeWidth = 11;
              canvas.drawArc(Rect.fromCircle(center: center, radius: r), pi * 0.75, pi * 1.5, false, track);

              final bar = Paint()
                ..color = color
                ..style = PaintingStyle.stroke
                ..strokeCap = StrokeCap.round
                ..strokeWidth = 11;
              double sweep = (speed / 200.0) * (pi * 1.5);
              canvas.drawArc(Rect.fromCircle(center: center, radius: r), pi * 0.75, sweep.clamp(0.0, pi * 1.5), false, bar);

              double needleAngle = (pi * 0.75) + sweep;
              final needle = Paint()
                ..color = Colors.white
                ..strokeWidth = 3.5
                ..strokeCap = StrokeCap.round;
              Offset p2 = Offset(center.dx + (r - 18) * cos(needleAngle), center.dy + (r - 18) * sin(needleAngle));
              canvas.drawLine(center, p2, needle);
            }

            @override
            bool shouldRepaint(covariant SpeedGaugePainter oldDelegate) => true;
          }
          EOF

          # بیلد استاندارد بدون فلگ‌های غیراستاندارد
          flutter build apk --release

          # انتقال فایل خروجی برای آپلود
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/Tiba2_Launcher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2_Launcher_App
          path: output/Tiba2_Launcher.apk
