name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        # دستور --verbose به ما جزئیات دقیقی می‌دهد که کجای کار می‌لنگد
        run: flutter build apk --split-per-abi --debug --verbose
        
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apks
          path: build/app/outputs/flutter-apk/*.apk
